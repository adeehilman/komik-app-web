<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mihon" />
    <meta name="theme-color" content="#1B1B1F" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <title>Mihon</title>
    <style>
      html, body { background: #121212; margin: 0; }
      #boot { color: #888; font-family: system-ui, sans-serif; display: flex; flex-direction: column;
              gap: 14px; align-items: center; justify-content: center; min-height: 100vh;
              padding: 24px; text-align: center; box-sizing: border-box; }
      #bootErr { display: none; color: #e57373; font-size: 13px; max-width: 92vw;
                 word-break: break-word; white-space: pre-line; }
      #bootDbgWrap { display: none; width: 100%; max-width: 92vw; }
      #bootDbg { background: #1a1a1e; border: 1px solid #444; border-radius: 8px; color: #b0bec5;
                 font: 11px/1.5 monospace; text-align: left; padding: 10px 12px; max-height: 40vh;
                 overflow: auto; white-space: pre-wrap; word-break: break-word; margin: 0; }
      .bootBtn { display: none; background: #2a2a2e; color: #fff; border: 1px solid #555;
                 border-radius: 8px; padding: 10px 22px; font-size: 15px; cursor: pointer; }
      #bootBtnRow { display: none; gap: 10px; flex-wrap: wrap; justify-content: center; }
      #bootBtnRow.show { display: flex; }
      #bootBtnRow .bootBtn { display: block; }
      #bootCopyOk { display: none; color: #81c784; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot">
      <div id="bootMsg">Memuat Mihon…</div>
      <div id="bootErr"></div>
      <div id="bootDbgWrap"><pre id="bootDbg"></pre></div>
      <div id="bootBtnRow">
        <button id="bootRetry" class="bootBtn" type="button">Coba lagi (bersihkan cache)</button>
        <button id="bootCopy" class="bootBtn" type="button">Salin info debug</button>
      </div>
      <div id="bootCopyOk">Info debug tersalin — kirim ke admin.</div>
    </div></div>
    <script>
      // Pelapor error + diagnosis boot: tampilkan error JS / gagal muat resource
      // beserta hasil probe jaringan di layar agar bisa dilaporkan.
      (function () {
        // Tanpa trailing slash (mis. /komik), URL relatif (vite base './')
        // resolve ke root sehingga JS/CSS 404 dan aplikasi tidak pernah boot.
        // Redirect dulu ke versi trailing slash; generik untuk subpath apa pun.
        try {
          var p = location.pathname;
          var last = p.split('/').pop();
          if (p.length > 1 && !/\/$/.test(p) && last.indexOf('.') === -1) {
            location.replace(p + '/' + location.search + location.hash);
            return;
          }
        } catch (e) {}
        var t0 = Date.now();
        var lines = [];
        var probed = false;
        function ts() { return '+' + ((Date.now() - t0) / 1000).toFixed(1) + 's'; }
        function log(msg) {
          lines.push('[' + ts() + '] ' + msg);
          var pre = document.getElementById('bootDbg');
          if (pre) {
            pre.textContent = lines.join('\n');
            document.getElementById('bootDbgWrap').style.display = 'block';
          }
        }
        function showErr(msg) {
          var el = document.getElementById('bootErr');
          if (!el) return;
          el.style.display = 'block';
          el.textContent += (el.textContent ? '\n' : '') + msg;
          document.getElementById('bootBtnRow').classList.add('show');
          runProbes();
        }
        function absUrl(u) {
          try { return new URL(u, document.baseURI).href; } catch (e) { return u; }
        }
        function runProbes() {
          if (probed) return;
          probed = true;
          log('MULAI DIAGNOSIS');
          log('URL: ' + location.href);
          log('UA: ' + navigator.userAgent);
          log('online: ' + navigator.onLine);
          try {
            log('SW controller: ' + (navigator.serviceWorker && navigator.serviceWorker.controller ? 'aktif' : 'tidak ada'));
          } catch (e) { log('SW: tidak didukung'); }
          var targets = [];
          var mod = document.querySelector('script[type="module"]');
          if (mod && mod.src) targets.push(['JS utama', mod.src]);
          var css = document.querySelector('link[rel="stylesheet"]');
          if (css && css.href) targets.push(['CSS', css.href]);
          targets.push(['Manifest', absUrl('manifest.webmanifest')]);
          targets.push(['API GraphQL', absUrl('api/graphql')]);
          var chain = Promise.resolve();
          targets.forEach(function (t) {
            chain = chain.then(function () {
              var label = t[0], url = t[1];
              var start = Date.now();
              return fetch(url, { cache: 'no-store', redirect: 'follow' }).then(function (r) {
                return r.arrayBuffer().then(function (buf) {
                  log(label + ': HTTP ' + r.status + ' (' + buf.byteLength + ' byte, ' + (Date.now() - start) + ' ms)');
                  log('  <- ' + url);
                });
              }).catch(function (e) {
                log(label + ': GAGAL FETCH (' + (Date.now() - start) + ' ms): ' + (e && e.message));
                log('  <- ' + url);
              });
            });
          });
          chain.then(function () { log('DIAGNOSIS SELESAI'); });
        }
        window.addEventListener('error', function (e) {
          var tgt = e.target;
          if (tgt && tgt !== window && tgt.tagName) {
            var src = tgt.src || tgt.href || '';
            var msg = 'GAGAL MUAT: <' + tgt.tagName + '> ' + src;
            log(msg);
            showErr(msg);
          } else {
            var msg2 = 'Error: ' + (e.message || e.type || 'unknown') +
              (e.filename ? ' @ ' + e.filename + ':' + (e.lineno || '?') : '');
            log(msg2);
            showErr(msg2);
          }
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason;
          var msg = 'Promise: ' + ((r && (r.stack || r.message)) || r || 'unknown');
          log(msg);
          showErr(msg);
        });
        setTimeout(function () {
          if (document.getElementById('boot')) {
            var m = document.getElementById('bootMsg');
            if (m) m.textContent = 'Masih memuat… (>25 detik)';
            var msg = 'Aplikasi tidak kunjung termuat. Kemungkinan cache / file JS bermasalah.';
            log('TIMEOUT 25 detik: ' + msg);
            showErr(msg);
          }
        }, 25000);
        document.getElementById('bootRetry').addEventListener('click', function () {
          (async function () {
            try {
              if ('serviceWorker' in navigator) {
                var regs = await navigator.serviceWorker.getRegistrations();
                for (var i = 0; i < regs.length; i++) await regs[i].unregister();
              }
              if (window.caches) {
                var keys = await caches.keys();
                for (var j = 0; j < keys.length; j++) await caches.delete(keys[j]);
              }
            } catch (e) {}
            location.reload();
          })();
        });
        document.getElementById('bootCopy').addEventListener('click', function () {
          var txt = lines.join('\n') || '(belum ada log)';
          function done() {
            document.getElementById('bootCopyOk').style.display = 'block';
          }
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(txt).then(done, function () { fallback(); });
          } else { fallback(); }
          function fallback() {
            var ta = document.createElement('textarea');
            ta.value = txt;
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand('copy'); } catch (e) {}
            document.body.removeChild(ta);
            done();
          }
        });
        log('boot reporter aktif');
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
